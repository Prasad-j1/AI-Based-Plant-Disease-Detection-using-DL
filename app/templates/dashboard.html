<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | AgroVision AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
    }

    nav {
      display: flex;
      justify-content: space-between;
      padding: 20px 10%;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 25px;
    }

    nav a {
      text-decoration: none;
      color: white;
      font-weight: 500;
    }

    .header {
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(135deg, #1e3a8a, #065f46);
    }

    .header h1 {
      font-size: 2.5rem;
    }

    .container {
      padding: 40px 10%;
      text-align: center;
    }

    .dashboard-img {
      width: 100%;
      max-width: 1200px;
      border-radius: 20px;
      margin-top: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .btn {
      margin-top: 30px;
      padding: 12px 30px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      background: linear-gradient(90deg, #22d3ee, #4ade80);
      color: black;
    }

    footer {
      text-align: center;
      padding: 30px;
      margin-top: 50px;
      background: #020617;
    }
  </style>
</head>

<body>

<nav>
  <h2>🌿 AgroVision AI</h2>
  <ul>
    <li><a href="{{ url_for('home') }}">Home</a></li>
    <li><a href="{{ url_for('predict_page') }}">Predict</a></li>
    <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
    <li><a href="{{ url_for('about') }}">About</a></li>
  </ul>
</nav>

<section class="header">
  <h1>📊 Dashboard Overview</h1>
  <p>System Performance & Analytics</p>
</section>

<div class="container">

  <h2>AI-Based Insights</h2>

  <!-- Dashboard Image -->
  <img src="{{ url_for('static', filename='dashboard.png') }}" class="dashboard-img">

  <br>

  <a href="{{ url_for('predict_page') }}">
    <button class="btn">Go to Prediction</button>
  </a>

</div>

<footer>
  © 2026 AgroVision AI
</footer>

</body>
</html>
