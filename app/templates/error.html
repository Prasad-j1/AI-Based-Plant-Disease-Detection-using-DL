<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Error | AgroVision AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: space-between;
      padding: 20px 10%;
      background: rgba(0,0,0,0.3);
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    .container {
      padding: 60px 20px;
    }

    .error-box {
      background: linear-gradient(135deg, #1e3a8a, #065f46);
      padding: 40px;
      border-radius: 20px;
      max-width: 600px;
      margin: auto;
    }

    img {
      margin-top: 20px;
      max-width: 300px;
      border-radius: 15px;
      border: 3px solid #4ade80;
    }

    .btn {
      margin-top: 30px;
      padding: 15px 35px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      background: linear-gradient(90deg, #22d3ee, #4ade80);
      color: black;
    }

    footer {
      margin-top: 50px;
      padding: 20px;
      background: #020617;
    }
  </style>
</head>
<body>

<nav>
  <h2>🌿 AgroVision AI</h2>
  <div>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('predict_page') }}">Predict</a>
  </div>
</nav>

<div class="container">
  <div class="error-box">
    <h2>⚠️ Oops! Wrong Image Uploaded</h2>

    <p style="margin-top:20px;">
      You uploaded <b>{{ detected_label }}</b><br>
      Please upload a <b>plant leaf image 🌿</b>
    </p>

    <img src="{{ image_path }}" alt="Uploaded Image">

    <br>

    <form action="{{ url_for('predict_page') }}">
      <button class="btn">Try Again</button>
    </form>
  </div>
</div>

<footer>© 2026 AgroVision AI</footer>

</body>
</html>
